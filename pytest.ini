[pytest]
# Collect the maintained suites only. Root-level scripts named *_test.py / test_*.py that are not
# pytest suites (test_tk.py is a manual Tk backend check; menus/astronomical/frb/dispersion_test.py is a
# retired FRB runner that needs healpy) are not collected.
testpaths =
    tests
    menus/particle/casimir/tests
    test_mcmc_engine.py
python_files = test_*.py
